name: TenantFence
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER_LOG_PATH: /tmp/tenantfence-wrangler.log
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/lab/pnpm-lock.yaml
      - run: pnpm install --dir apps/lab --frozen-lockfile
      - run: make check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sanitized-isolation-reports
          path: |
            reports/secure/*.json
            reports/secure/*.html
            reports/vulnerable/*.json
            reports/vulnerable/*.html
          if-no-files-found: warn
